        display: flex;

        background: var(--m-bg);
      }

        box-shadow: inset 0 0 0 2px var(--m-accent-edge);
      }
      .c-row.playing {
        background: var(--m-accent-soft);
      }
      .c-row-text {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
      }
      .c-row-name {
        font-weight: 650;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .c-row-detail {
        font-size: 0.78rem;
        color: var(--m-muted);
      }
      /* An interpretation's notes from its creator, under its performers */
      .c-row-notes {
        line-height: 1.4;
        white-space: pre-line;
      }
      .c-row-wide {
        flex-basis: 100%;
        margin: 0;
      }
      .c-row-link,
      .c-icon-link {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        color: var(--m-accent);
        font-size: 0.85rem;
        font-weight: 650;
        text-decoration: none;
      }
      .c-icon-link .c-icon {
        width: 18px;
        height: 18px;
      }
      .c-video {
        position: relative;
        flex: none;
        width: 96px;
        aspect-ratio: 16 / 9;
        border-radius: 7px;
        overflow: hidden;
        background: #000;
      }
      .c-video img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .c-video-play {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff;
        background: rgb(0 0 0 / 0.25);
      }
      .c-play {
        flex: none;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: var(--m-accent);
        color: #fff;
        cursor: pointer;
        transition: transform 0.12s;
      }
      .c-play:hover {
        transform: scale(1.08);
      }
      .c-play .c-icon {
        width: 22px;
        height: 22px;
      }
      .c-play.loading {
        animation: c-pulse 0.9s ease-in-out infinite;
      }
      @keyframes c-pulse {
        50% {
          opacity: 0.45;
        }
      }
      .c-play-progress {
        display: block;
        height: 6px;
        border-radius: 3px;
        background: var(--m-line);
        overflow: hidden;
      }
      /* A progress bar to jump with (take-audio.ts's seekBar()): pressed anywhere in a taller band
         round it (a transparent border), so it is easy to hit */
      .seek {
        box-sizing: content-box;
        border-block: 7px solid transparent;
        background-clip: padding-box;
        cursor: pointer;
        touch-action: manipulation;
      }
      .seek:focus-visible {
        outline: 2px solid var(--m-accent);
        outline-offset: 0;
      }
      .c-play-progress span {
        display: block;
        height: 100%;
        background: var(--m-accent);
      }
      .c-rank {
        flex: none;
        display: grid;
        place-items: center;
        width: 1.8rem;
        height: 1.8rem;
        border-radius: 50%;
        font-weight: 800;
        font-size: 0.85rem;
        background: var(--m-surface);
        color: var(--m-muted);
      }
      .c-rank.rank-1 {
        background: linear-gradient(135deg, #ffe680, #e0a800);
        color: #5a3d00;
      }
      .c-rank.rank-2 {
        background: linear-gradient(135deg, #f1f3f5, #aab2bb);
        color: #33393f;
      }
      .c-rank.rank-3 {
        background: linear-gradient(135deg, #f5c79a, #b8733a);
        color: #4a2a0c;
      }
      .c-points {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .c-points small {
        font-weight: 600;
        color: var(--m-muted);
      }
      .c-stars {
        color: #e0a800;
        letter-spacing: 0.05em;
      }
      .c-stars .off {
        color: var(--m-line);
      }
