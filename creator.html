        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--m-accent);

      }

      .c-art-line {

      }
      .c-art-badge g {
        color: #fff;
      }

      @keyframes c-float {

      .c-features {

      cursor: pointer;
    }
    .format:hover {
      background: var(--m-accent-soft);
      color: var(--m-accent);
    }
    .format:focus-visible {
      outline: 2px solid var(--m-accent);
      outline-offset: 1px;
    }
    .format svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .format svg .fill {
      fill: currentColor;
      stroke: none;
    }
    .gap {
      width: 1px;
      height: 20px;
      margin: 0 0.3rem;
      background: var(--m-line);
    }
    .rich {
      min-height: 120px;
      max-height: 420px;
      overflow-y: auto;
      padding: 0.75rem 0.9rem;
      outline: none;
      color: var(--m-text);
      line-height: 1.5;
    }
    .rich > :first-child {
      margin-top: 0;
    }
    .rich > :last-child {
      margin-bottom: 0;
    }
    .rich h3 {
      margin: 0.8em 0 0.3em;
      font-size: 1.05rem;
    }
    .rich ul,
    .rich ol {
      padding-left: 1.4rem;
    }
    .rich.empty::before {
      content: attr(data-placeholder);
      color: var(--m-muted);
      opacity: 0.7;
      pointer-events: none;
    }

        margin: 0;
      }
      .c-genre-names {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 0.75rem;
      }
      .c-error-text {
        color: var(--m-red);
      }
      .c-drop {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        padding: 1.25rem;
        border: 2px dashed var(--m-line);
        border-radius: 14px;
        text-align: center;
        font-size: 0.95rem;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .c-drop:hover,
      .c-drop.over {
        border-color: var(--m-accent);
        background: var(--m-accent-soft);
      }
      .c-drop-icon {
        color: var(--m-accent);
      }
      .c-drop-icon .c-icon {
        width: 28px;
        height: 28px;
      }
      .c-file {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--m-line);
        border-radius: 12px;
        background: var(--m-bg);
      }
      .c-file.uploading {
        color: var(--m-accent);
      }
      .c-file-icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-file-text {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 0.15rem;
        min-width: 0;
      }
      .c-file-name {
        font-weight: 650;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .c-file-details {
        font-size: 0.82rem;
        color: var(--m-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .c-progress {
        flex: 1;
        display: block;
        height: 6px;
        border-radius: 3px;
        background: var(--m-line);
        overflow: hidden;
        min-width: 60px;
      }
      .c-progress span {
        display: block;
        height: 100%;
        background: var(--m-accent);
        transition: width 0.2s;
      }
      /* A score's preview picture (previewPicture()) */
      .c-preview {
        margin: 0.6rem 0 0;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      .c-preview img {
        display: block;
        width: 100%;
        max-width: 560px;
        border-radius: 10px;
        border: 1px solid var(--m-line);
        background: #fff;
      }
      .c-preview figcaption,
      .c-preview-note {
        margin: 0.4rem 0 0;
        font-size: 0.78rem;
        color: var(--m-muted);
      }
      .c-preview-note.busy {
        animation: c-timing-busy 1.2s ease-in-out infinite;
      }
      /* What the score check found (scoreReport()) */
      .c-check-list {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 3px;
      }
      .c-check {
        margin: 6px 0 0;
        font-size: 0.8rem;
        line-height: 1.35;
        color: var(--m-muted);
      }
      .c-check-list .c-check {
        margin: 0;
      }
      .c-check.warn {
        color: var(--m-amber, #b45309);
      }
      .c-check.ok {
        color: var(--m-green, #16a34a);
      }
      /* An interpretation's tempo map (timingLine()): made, being made, failed, or a key to make it */
      .c-timing {
        font-size: 0.78rem;
        color: var(--m-muted);
      }
      .c-timing.ok {
        color: var(--m-green, #16a34a);
        font-weight: 600;
      }
      .c-timing.bad {
        color: var(--m-red, #dc2626);
      }
      .c-timing.busy {
        animation: c-timing-busy 1.2s ease-in-out infinite;
      }
      @keyframes c-timing-busy {
        50% {
          opacity: 0.4;
        }
      }
      .c-link-button {
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--m-accent);
        cursor: pointer;
      }
      .c-link-button:hover {
        text-decoration: underline;
      }
      .c-link-button.quiet {
        font-weight: 500;
        color: var(--m-muted);
      }

      /* Listening to a YouTube video (captureHint(), capturePanel()): the hint as a dialog */
      .c-capture-scrim {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.45);
      }
      .c-capture-card {
        width: min(480px, 100%);
        padding: 1.4rem 1.5rem 1.2rem;
        border-radius: 16px;
        background: var(--m-surface);
        color: var(--m-text);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      .c-capture-card h2 {
        margin: 0 0 0.6rem;
        font-size: 1.2rem;
      }
      .c-capture-steps {
        margin: 0;
        padding-left: 1.2rem;
        display: grid;
        gap: 0.45rem;
        line-height: 1.45;
      }
      .c-capture-browsers {
        margin: 0.9rem 0 0;
        font-size: 0.85rem;
        color: var(--m-muted);
      }
      .c-capture-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 1.1rem;
      }
      /* The video while it listens: floating bottom left, as in the app */
      .video {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 25;
        width: min(380px, calc(100vw - 32px));
        border-radius: 8px;
        overflow: hidden;
        background: #111;
        color: #ddd;
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .video-bar,
      .video-status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0 0.25rem 0 0.6rem;
        font: 600 0.75rem system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .video-bar {
        height: 28px;
      }
      .video-status {
        height: 30px;
        padding-right: 0.6rem;
      }
      .video-label {
        flex: none;
        padding: 0.1em 0.45em;
        border-radius: 3px;
        color: #fff;
        background: #e62117;
        font-size: 0.68rem;
      }
      .video-name,
      .video-text {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .video-close {
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: inherit;
        font-size: 1.1rem;
        line-height: 1;
        cursor: pointer;
      }
      .video-close:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .video-frame {
        aspect-ratio: 16 / 9;
      }
      .video-frame iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .video-dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e62117;
        animation: c-timing-busy 1.2s ease-in-out infinite;
      }
      .video-time {
        flex: none;
        font-variant-numeric: tabular-nums;
        color: #aaa;
      }
      .video-progress {
        display: block;
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
      }
      .video-progress span {
        display: block;
        height: 100%;
        background: #e62117;
      }
      /* The bar reached, and "The piece is over": a light key on the dark panel */
      .video-done {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.4rem 0.4rem 0.4rem 0.6rem;
        font: 600 0.75rem system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .video-reached {
        color: #aaa;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .video-over {
        flex: none;
        height: 28px;
        padding: 0 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      .video-over:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.18);
      }
      .video-over:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .video-over:disabled {
        opacity: 0.45;
        cursor: default;
      }
      /* Moved every frame while a piece plays: no easing behind it */
      .c-progress.playing span {
        transition: none;
      }
      .c-listening {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0 0.25rem;
      }
      .c-listen-time {
        font-size: 0.82rem;
        color: var(--m-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .c-warning,
      .c-error {
        font-size: 0.85rem;
        margin-top: 0.15rem;
      }
      .c-warning {
        color: var(--m-amber);
      }
      .c-error {
        color: var(--m-red);
      }
      .c-interpretations {
        list-style: none;
        margin: 0 0 0.75rem;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }
      /* An interpretation (interpretationCard()): a card of its own, airy, in sections */
      .c-interp {
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        padding: 1rem 1.1rem 1.1rem;
        border: 1px solid var(--m-line);
        border-radius: 16px;
        background: var(--m-surface);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        animation: c-in 0.2s ease-out;
      }
      .c-interp-head {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: start;
        gap: 1.25rem;
      }
      .c-interp-media {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        width: 160px;
        min-width: 0;
      }
      .c-interp-thumb {
        position: relative;
        display: block;
        width: 160px;
        height: 90px;
        border-radius: 10px;
        overflow: hidden;
        background: var(--m-line);
      }
      .c-interp-thumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.25s ease;
      }
      .c-interp-thumb.playable:hover img {
        transform: scale(1.05);
      }
      /* The play key on a video's picture: YouTube's red, lit on hover */
      .c-play-badge {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, 0.25));
      }
      .c-play-badge svg {
        width: 46px;
        height: 32px;
        padding: 0 6px;
        border-radius: 9px;
        background: rgba(18, 18, 18, 0.75);
        fill: #fff;
        transition: background 0.15s;
      }
      .c-interp-thumb.playable:hover .c-play-badge svg {
        background: #ff0033;
      }
      .c-interp-thumb.audio {
        display: grid;
        place-items: center;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-interp-main {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        min-width: 0;
      }
      .c-interp-kind {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        min-width: 0;
        font-size: 0.78rem;
      }
      .c-interp-source {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--m-muted);
      }
      a.c-interp-source:hover {
        color: var(--m-accent);
      }
      /* Its interpretation data: a quiet panel, its state on the right of the heading */
      .c-data {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        padding: 0.9rem 1rem 1rem;
        border-radius: 12px;
        background: var(--m-bg);
      }
      .c-data-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.4rem 0.75rem;
      }
      .c-data-title {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-weight: 700;
      }
      .c-status {
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 650;
        color: var(--m-muted);
        background: var(--m-surface);
        border: 1px solid var(--m-line);
      }
      .c-status.ok {
        color: #15803d;
        background: color-mix(in srgb, #16a34a 10%, var(--m-surface));
        border-color: color-mix(in srgb, #16a34a 30%, transparent);
      }
      .c-status.bad {
        color: #b91c1c;
        background: color-mix(in srgb, #dc2626 8%, var(--m-surface));
        border-color: color-mix(in srgb, #dc2626 30%, transparent);
      }
      .c-status.todo {
        color: #a16207;
        background: color-mix(in srgb, #f59e0b 10%, var(--m-surface));
        border-color: color-mix(in srgb, #f59e0b 35%, transparent);
      }
      .c-status.busy {
        color: var(--m-accent);
        animation: c-timing-busy 1.2s ease-in-out infinite;
      }
      .c-data-body {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr);
        gap: 1rem;
      }
      /* How it works: a hint beside the ways, in the theme colour's softest shade */
      .c-data-hint {
        padding: 0.8rem 0.95rem;
        border-radius: 10px;
        background: var(--m-accent-soft);
        font-size: 0.85rem;
        line-height: 1.5;
      }
      .c-data-hint strong {
        display: block;
        margin-bottom: 0.35rem;
        color: var(--m-accent);
      }
      .c-data-hint p {
        margin: 0;
      }
      /* The two ways, numbered as the cards beside them, "or" between */
      .c-data-hint-ways {
        margin: 0.6rem 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.3rem;
      }
      .c-data-hint-ways li {
        display: flex;
        align-items: flex-start;
        gap: 0.55rem;
      }
      .c-data-hint-ways .c-way-number {
        margin-top: 0.05rem;
      }
      .c-data-hint-note {
        color: var(--m-muted);
      }
      /* "or": a word between two short lines, between the ways */
      .c-or {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        color: var(--m-muted);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .c-or::before,
      .c-or::after {
        content: '';
        flex: 1;
        border-top: 1px solid var(--m-line);
      }
      .c-data-hint-ways .c-or {
        padding-left: 1.85rem;
      }
      .c-data-hint-ways .c-or::before {
        flex: 0 0 0.6rem;
      }
      .c-data-ways {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .c-way {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.6rem;
        padding: 0.8rem 0.9rem;
        border: 1px solid var(--m-line);
        border-radius: 10px;
        background: var(--m-surface);
      }
      .c-way .c-audio-parts {
        align-self: stretch;
      }
      .c-way-head {
        display: flex;
        gap: 0.65rem;
      }
      .c-way-head p {
        margin: 0.15rem 0 0;
        font-size: 0.84rem;
        line-height: 1.45;
        color: var(--m-muted);
      }
      .c-way-number {
        flex: none;
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--m-accent);
        color: #fff;
        font-size: 0.75rem;
        font-weight: 800;
      }
      .c-interpretation {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.2fr) 5.5rem auto;
        align-items: center;
        gap: 0.6rem;
        padding: 0.5rem;
        border: 1px solid var(--m-line);
        border-radius: 12px;
        background: var(--m-bg);
        animation: c-in 0.2s ease-out;
      }
      /* A video's audio in parts (audioParts()): across the row, three slots side by side */
      .c-audio-parts {
        display: grid;
        gap: 0.4rem;
      }
      .c-audio-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.25rem 0.6rem;
      }
      .c-audio-slots {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.5rem;
      }
      @media (max-width: 640px) {
        .c-audio-slots {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .c-audio-slot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.35rem 0.5rem;
        min-height: 2.6rem;
        padding: 0.45rem 0.6rem;
        border: 1px dashed var(--m-line);
        border-radius: 10px;
        background: var(--m-surface);
        cursor: pointer;
        font-size: 0.82rem;
      }
      .c-audio-slot.filled {
        border-style: solid;
      }
      .c-audio-slot.over {
        border-color: var(--m-accent);
        background: var(--m-accent-soft);
      }
      .c-audio-part {
        flex: none;
        font-weight: 700;
      }
      .c-audio-file {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--m-muted);
      }
      .c-audio-choose {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        margin-left: auto;
        color: var(--m-accent);
        font-weight: 600;
      }
      .c-audio-choose svg {
        width: 16px;
        height: 16px;
      }
      .c-audio-slot .c-progress {
        flex: 1;
      }
      .c-error.small {
        flex-basis: 100%;
        margin: 0;
        font-size: 0.78rem;
      }
      .c-thumb {
        width: 64px;
        height: 36px;
        border-radius: 6px;
        object-fit: cover;
        background: var(--m-line);
      }
      .c-thumb.audio {
        display: grid;
        place-items: center;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-interpretation-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.2rem;
        min-width: 0;
      }
      .c-tag {
        padding: 0.1rem 0.45rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-tag.youtube {
        background: color-mix(in srgb, #ff0033 12%, var(--m-surface));
        color: #e00030;
      }
      .c-performers,
      .c-year {
        min-height: 38px;
        padding: 0.35rem 0.6rem;
        font-size: 0.9rem;
      }
      .c-youtube-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0.75rem;
        padding: 0.85rem;
        margin-bottom: 0.5rem;
        border-radius: 12px;
        background: var(--m-bg);
        border: 1px solid var(--m-line);
        animation: c-in 0.2s ease-out;
      }
      .c-add-piece {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 64px;
        border: 2px dashed var(--m-accent-edge);
        border-radius: 16px;
        background: none;
        color: var(--m-accent);
        font-weight: 650;
        font-size: 1rem;
        line-height: 1;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s;
      }
      .c-add-piece:hover {
        background: var(--m-accent-soft);
      }
      /* The save bar along the foot */
      .c-save-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        padding: 0.75rem 1.25rem calc(0.75rem + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--m-surface) 92%, transparent);
        backdrop-filter: blur(8px);
        border-top: 1px solid var(--m-line);
      }
      .c-save-inner {
        width: min(1000px, 100%);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      /* A pack players have: the next version's note for them, over the keys */
      .c-release {
        flex-wrap: wrap;
        margin-bottom: 0.6rem;
      }
      .c-release-note {
        display: flex;
        flex: 1 1 320px;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--m-muted);
      }
      .c-release-note input {
        height: 36px;
        padding: 0 0.7rem;
        font: inherit;
        font-weight: 400;
        font-size: 0.9rem;
        color: var(--m-text);
        background: var(--m-surface);
        border: 1px solid var(--m-line);
        border-radius: 8px;
      }
      .c-save-status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--m-muted);
        font-size: 0.92rem;
      }
      .c-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;

      }
