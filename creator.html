      .c-back {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.35rem 0.6rem 0.35rem 0.3rem;
        margin: -0.5rem 0 -0.5rem -0.3rem;
        border: none;
        border-radius: 8px;
        background: none;
        color: var(--m-accent);
        font-weight: 600;
        font-size: 0.95rem;
        line-height: 1;
        font-family: inherit;
        cursor: pointer;
      }
      .c-back:hover {
        background: var(--m-accent-soft);
      }
      a.c-button {
        text-decoration: none;
      }
      .c-icon-button {
        display: grid;
        place-items: center;
        flex: none;
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 50%;
        background: none;
        color: var(--m-muted);
        cursor: pointer;
      }
      .c-icon-button:hover:not(:disabled) {
        background: var(--m-bg);
        color: var(--m-text);
      }
      .c-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
      }
      .c-actions.start {
        justify-content: flex-start;
      }

      /* Signed out */
      .c-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
        align-items: center;
        gap: 1.5rem;
        padding: clamp(1.5rem, 4vw, 2.75rem);
        border-radius: 20px;
        background:
          radial-gradient(120% 120% at 100% 0%, var(--m-accent-soft), transparent 60%),
          var(--m-surface);
        box-shadow: 0 1px 2px var(--m-shadow);
      }
      .c-hero-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .c-hero h1 {
        font-size: clamp(1.9rem, 5vw, 2.8rem);
      }
      .c-kicker {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--m-accent);
      }
      .c-hero-art svg {
        width: 100%;
        max-width: 340px;
        display: block;
        margin: 0 auto;
        overflow: visible;
      }
      .c-art-page {
        fill: var(--m-surface);
        stroke: var(--m-line);
        stroke-width: 1.5;
      }
      .back .c-art-page {
        fill: var(--m-bg);
      }
      .front .c-art-page {
        filter: drop-shadow(0 6px 14px var(--m-shadow));
      }
      .c-art-line {
        stroke: var(--m-muted);
        stroke-width: 0.8;
        opacity: 0.45;
      }
      .c-art-note {
        fill: var(--m-accent);
      }
      .c-art-badge circle {
        fill: var(--m-accent);
        filter: drop-shadow(0 4px 10px var(--m-shadow));
      }
      .c-art-badge g {
        color: #fff;
      }
      .front {
        animation: c-float 5s ease-in-out infinite;
      }
      @keyframes c-float {
        50% {
          transform: translate(34px, 18px) rotate(-3deg);
        }
      }
      .c-features {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
      }
      .c-feature {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .c-feature p {
        color: var(--m-muted);
        font-size: 0.95rem;
      }
      .c-feature-icon {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
        margin-bottom: 0.25rem;
      }
      .c-feature-icon .c-icon {
        width: 24px;
        height: 24px;
      }
      .c-steps {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .c-steps ol {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
      }
      .c-steps li {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        font-size: 0.95rem;
        line-height: 1.4;
      }
      .c-step-number {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--m-accent);
        color: #fff;
        font-weight: 800;
        font-size: 0.9rem;
      }

        align-items: center;
        justify-content: space-between;

        background: var(--m-accent-soft);
      }
      .c-cta div {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .c-cta p {
        color: var(--m-muted);
      }

      .c-badge {
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        background: var(--m-accent);
        color: #fff;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .c-avatar {
        display: grid;
        place-items: center;
        flex: none;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--m-bg);
        box-shadow:
          0 0 0 3px var(--m-surface),
          0 2px 10px var(--m-shadow);
      }
      .c-avatar.large {
        width: 104px;
        height: 104px;
      }
      .c-avatar.initial {
        background: var(--m-accent);
        color: #fff;
        font-weight: 800;
        font-size: 1.5rem;
      }
      .c-avatar.large.initial {
        font-size: 2.6rem;
      }

      .c-toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .c-toolbar > div {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .c-grid {

        grid-template-columns: repeat(3, minmax(0, 1fr));

      }
      @media (max-width: 900px) {
        .c-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 600px) {
        .c-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .c-pack {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.1rem;
        transition: box-shadow 0.15s;
      }
      .c-pack:hover {
        box-shadow: 0 4px 18px var(--m-shadow);
      }
      .c-pack.skeleton {
        min-height: 150px;
        background: linear-gradient(90deg, var(--m-surface), var(--m-bg), var(--m-surface));
        background-size: 200% 100%;
        animation: c-shimmer 1.4s linear infinite;
      }
      @keyframes c-shimmer {
        to {
          background-position: -200% 0;
        }
      }
      .c-pack-open {
        display: flex;
        gap: 0.9rem;
        padding: 0;
        border: none;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .c-pack-icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-pack-icon .c-icon {
        width: 26px;
        height: 26px;
      }
      .c-pack-text {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
      }
      .c-pack-title {
        font-weight: 750;
        font-size: 1.1rem;
        overflow-wrap: anywhere;
      }
      .c-pack-description {
        color: var(--m-muted);
        font-size: 0.92rem;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .c-pack-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.6rem;
        color: var(--m-muted);
        font-size: 0.82rem;
        margin-top: 0.15rem;
      }
      .c-chip {
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        background: var(--m-bg);
        color: var(--m-text);
        font-weight: 600;
      }
      .c-pack .c-actions {
        margin-top: auto;
      }
      .c-confirm {

        flex-direction: column;

        padding: 0.85rem;

        background: color-mix(in srgb, var(--m-red) 8%, var(--m-surface));
        border: 1px solid color-mix(in srgb, var(--m-red) 30%, var(--m-surface));
        font-size: 0.92rem;
        animation: c-in 0.2s ease-out;
      }
      .c-confirm.inline {
        margin-top: 0.75rem;
      }
      @keyframes c-in {
        from {

          transform: translateY(-4px);

      }

        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.75rem;
        padding: 3rem 1.5rem;
      }
      .c-empty p {
        color: var(--m-muted);
        max-width: 28em;
      }
      .c-empty-icon {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-empty-icon .c-icon {
        width: 38px;
        height: 38px;
      }

      @media (max-width: 760px) {
        .c-hero {
          grid-template-columns: minmax(0, 1fr);
        }
        .c-hero-art {
          order: -1;
        }
        .c-hero-art svg {
          max-width: 220px;
        }
        .c-features,
        .c-steps ol {
          grid-template-columns: minmax(0, 1fr);
        }
        .c-steps li {
          flex-direction: row;
          align-items: center;
        }
        .c-cta {
          flex-direction: column;
          align-items: flex-start;
        }
      }
      @media (max-width: 480px) {
        .c-main {
          padding: 1.25rem 0.75rem 7rem;
        }
        .c-card {
          padding: 1rem;
        }
        .m-header {
          padding: 0.55rem 0.75rem;
        }
        .m-name {
          font-size: 1rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .front,
        .c-pack.skeleton,
        .skeleton {
          animation: none;
        }
      }

        color: var(--m-text);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      .c-capture-card h2 {
        margin: 0 0 0.6rem;
        font-size: 1.2rem;
      }
      .c-capture-steps {
        margin: 0;
        padding-left: 1.2rem;
        display: grid;
        gap: 0.45rem;
        line-height: 1.45;
      }
      .c-capture-browsers {
        margin: 0.9rem 0 0;
        font-size: 0.85rem;
        color: var(--m-muted);
      }
      .c-capture-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 1.1rem;
      }
      /* The video while it listens: floating bottom left, as in the app */
      .video {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 25;
        width: min(380px, calc(100vw - 32px));
        border-radius: 8px;
        overflow: hidden;
        background: #111;
        color: #ddd;
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .video-bar,
      .video-status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0 0.25rem 0 0.6rem;
        font: 600 0.75rem system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .video-bar {
        height: 28px;
      }
      .video-status {
        height: 30px;
        padding-right: 0.6rem;
      }
      .video-label {
        flex: none;
        padding: 0.1em 0.45em;
        border-radius: 3px;
        color: #fff;
        background: #e62117;
        font-size: 0.68rem;
      }
      .video-name,
      .video-text {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .video-close {
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: inherit;
        font-size: 1.1rem;
        line-height: 1;
        cursor: pointer;
      }
      .video-close:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .video-frame {
        aspect-ratio: 16 / 9;
      }
      .video-frame iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .video-dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e62117;
        animation: c-timing-busy 1.2s ease-in-out infinite;
      }
      .video-time {
        flex: none;
        font-variant-numeric: tabular-nums;
        color: #aaa;
      }
      .video-progress {
        display: block;
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
      }
      .video-progress span {
        display: block;
        height: 100%;
        background: #e62117;
      }
      /* Moved every frame while a piece plays: no easing behind it */
      .c-progress.playing span {
        transition: none;
      }
      .c-listening {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0 0.25rem;
      }
      .c-listen-time {
        font-size: 0.82rem;
        color: var(--m-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .c-warning,
      .c-error {
        font-size: 0.85rem;
        margin-top: 0.15rem;
      }
      .c-warning {
        color: var(--m-amber);
      }
      .c-error {
        color: var(--m-red);
      }
      .c-interpretations {
        list-style: none;
        margin: 0 0 0.5rem;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .c-interpretation {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.2fr) 5.5rem auto;
        align-items: center;
        gap: 0.6rem;
        padding: 0.5rem;
        border: 1px solid var(--m-line);
        border-radius: 12px;
        background: var(--m-bg);
        animation: c-in 0.2s ease-out;
      }
      .c-thumb {
        width: 64px;
        height: 36px;
        border-radius: 6px;
        object-fit: cover;
        background: var(--m-line);
      }
      .c-thumb.audio {
        display: grid;
        place-items: center;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-interpretation-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.2rem;
        min-width: 0;
      }
      .c-tag {
        padding: 0.1rem 0.45rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-tag.youtube {
        background: color-mix(in srgb, #ff0033 12%, var(--m-surface));
        color: #e00030;
      }
      .c-performers,
      .c-year {
        min-height: 38px;
        padding: 0.35rem 0.6rem;
        font-size: 0.9rem;
      }
      .c-youtube-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 7rem;
        gap: 0.75rem;
        padding: 0.85rem;
        margin-bottom: 0.5rem;
        border-radius: 12px;
        background: var(--m-bg);
        border: 1px solid var(--m-line);
        animation: c-in 0.2s ease-out;
      }
      .c-add-piece {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 64px;
        border: 2px dashed var(--m-accent-edge);
        border-radius: 16px;
        background: none;
        color: var(--m-accent);
        font-weight: 650;
        font-size: 1rem;
        line-height: 1;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s;
      }
      .c-add-piece:hover {
        background: var(--m-accent-soft);
      }
      /* The save bar along the foot */
      .c-save-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        padding: 0.75rem 1.25rem calc(0.75rem + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--m-surface) 92%, transparent);
        backdrop-filter: blur(8px);
        border-top: 1px solid var(--m-line);
      }
      .c-save-inner {
        width: min(1000px, 100%);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .c-save-status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--m-muted);
        font-size: 0.92rem;
      }
      .c-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--m-green);
        flex: none;
      }
      .dirty .c-dot {
        background: var(--m-amber);
      }
      .failed .c-dot {
        background: var(--m-red);
      }
      .failed .c-save-status {
        color: var(--m-red);
      }

      /* Narrower: the pieces' fields in one column */
      @media (max-width: 760px) {
        .c-piece-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .c-interpretation {
          grid-template-columns: auto minmax(0, 1fr) auto;
        }
        .c-performers {
          grid-column: 1 / 3;
        }
        .c-year {
          grid-column: 3 / 4;
          width: 6rem;
        }
      }
      @media (max-width: 480px) {
        .c-save-inner {
          flex-direction: column;
          align-items: stretch;
          gap: 0.5rem;
        }
      }
