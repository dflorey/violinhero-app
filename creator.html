        stroke-linejoin: round;
      }
      .c-icon .fill {

      }
      .c-icon .thin {

      }
      /* Buttons as the app's: one height and corner radius, the primary in the theme colour */
      .c-button {

        background: var(--m-surface);
        color: var(--m-text);
        font-weight: 600;
        font-size: 0.95rem;
        line-height: 1;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.1s;

      .c-button:hover:not(:disabled) {

      }

      }
      .c-button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .c-button.primary {
        background: var(--m-accent);
        border-color: var(--m-accent);
        color: #fff;
      }
      .c-button.primary:hover:not(:disabled) {
        background: var(--m-accent-hover, var(--m-accent));
      }
      .c-button.danger {
        background: var(--m-red);
        border-color: var(--m-red);
        color: #fff;
      }
      .c-button.ghost {
        background: none;
        border-color: transparent;
      }
      .c-button.danger-text {
        color: var(--m-red);
      }
      .c-button.large {
        min-height: 50px;
        padding: 0 1.6rem;
        font-size: 1.02rem;
        border-radius: 12px;
      }
      .c-button.small {
        min-height: 36px;
        padding: 0 0.85rem;
        font-size: 0.88rem;
      }
      .c-button:focus-visible,
      .c-icon-button:focus-visible,
      .c-pack-open:focus-visible,
      .c-back:focus-visible,
      .c-add-piece:focus-visible {
        outline: 2px solid var(--m-accent);
        outline-offset: 2px;
      }
      /* Back to a list (the creator's editor, a pack's page in the marketplace) */
      .c-back {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.35rem 0.6rem 0.35rem 0.3rem;
        margin: -0.5rem 0 -0.5rem -0.3rem;
        border: none;
        border-radius: 8px;
        background: none;
        color: var(--m-accent);
        font-weight: 600;
        font-size: 0.95rem;
        line-height: 1;
        font-family: inherit;
        cursor: pointer;
      }
      .c-back:hover {
        background: var(--m-accent-soft);
      }
      a.c-button {
        text-decoration: none;
      }
      .c-icon-button {
        display: grid;
        place-items: center;
        flex: none;
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 50%;
        background: none;
        color: var(--m-muted);
        cursor: pointer;
      }
      .c-icon-button:hover:not(:disabled) {
        background: var(--m-bg);
        color: var(--m-text);
      }
      .c-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
      }
      .c-actions.start {
        justify-content: flex-start;
      }

      /* Signed out */
      .c-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
        align-items: center;
        gap: 1.5rem;
        padding: clamp(1.5rem, 4vw, 2.75rem);
        border-radius: 20px;
        background:
          radial-gradient(120% 120% at 100% 0%, var(--m-accent-soft), transparent 60%),
          var(--m-surface);
        box-shadow: 0 1px 2px var(--m-shadow);
      }
      .c-hero-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;

      }

      .c-kicker {

      }
      .c-feature-icon .c-icon {
        width: 24px;
        height: 24px;
      }

      }

      }
      .c-steps li {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        font-size: 0.95rem;
        line-height: 1.4;
      }
      .c-step-number {

      .c-profile {

        background-size: 200% 100%;
        animation: c-shimmer 1.4s linear infinite;

        display: flex;
        flex-direction: column;
        gap: 0.6rem;

        flex-wrap: wrap;

        font: inherit;

        display: grid;
        place-items: center;

        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-pack-icon .c-icon {
        width: 26px;
        height: 26px;
      }
      .c-pack-text {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
      }
      .c-pack-title {
        font-weight: 750;
        font-size: 1.1rem;
        overflow-wrap: anywhere;
      }
      .c-pack-description {
        color: var(--m-muted);
        font-size: 0.92rem;
        line-height: 1.4;

        -webkit-line-clamp: 2;

        gap: 0.6rem;
        color: var(--m-muted);

        }

        .front,

        .skeleton {
          animation: none;
        }
      }
