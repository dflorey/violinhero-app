        background: var(--m-accent-soft);
      }
      a.c-button {
        text-decoration: none;
      }
      .c-icon-button {

        flex: none;

        height: 36px;
        border: none;
        border-radius: 50%;
        background: none;
        color: var(--m-muted);
        cursor: pointer;
      }
      .c-icon-button:hover:not(:disabled) {
        background: var(--m-bg);
        color: var(--m-text);
      }
      .c-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
      }
      .c-actions.start {
        justify-content: flex-start;
      }

      /* Signed out */
      .c-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
        align-items: center;
        gap: 1.5rem;
        padding: clamp(1.5rem, 4vw, 2.75rem);
        border-radius: 20px;
        background:
          radial-gradient(120% 120% at 100% 0%, var(--m-accent-soft), transparent 60%),
          var(--m-surface);
        box-shadow: 0 1px 2px var(--m-shadow);
      }
      .c-hero-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }

        font-size: clamp(1.9rem, 5vw, 2.8rem);
      }
      .c-kicker {
        font-size: 0.8rem;

        letter-spacing: 0.08em;
        text-transform: uppercase;

        overflow: visible;
      }
      .c-art-page {

      }

      }
      .c-art-line {

      }
      .c-art-note {
        fill: var(--m-accent);
      }
      .c-art-badge circle {
        fill: var(--m-accent);

      }
      .c-art-badge g {

      }

      @keyframes c-float {

      .c-features {

      }

        display: grid;
        place-items: center;

        height: 44px;
        border-radius: 12px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
        margin-bottom: 0.25rem;
      }
      .c-feature-icon .c-icon {
        width: 24px;
        height: 24px;
      }
      .c-steps {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .c-steps ol {
        list-style: none;

        padding: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
      }
      .c-steps li {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        font-size: 0.95rem;
        line-height: 1.4;
      }
      .c-step-number {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--m-accent);
        color: #fff;
        font-weight: 800;
        font-size: 0.9rem;

      .c-cta {
        display: flex;

        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .c-pack-icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-pack-icon .c-icon {
        width: 26px;
        height: 26px;
      }
      .c-pack-text {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
      }
      .c-pack-title {
        font-weight: 750;
        font-size: 1.1rem;
        overflow-wrap: anywhere;

        }

        text-align: right;

      .play {

        height: 26px;

      }

        border-radius: 6px;

        background: color-mix(in srgb, var(--m-accent) 12%, transparent);
      }
      .label {
        overflow: hidden;
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        text-overflow: ellipsis;

      .row.good .fill {
        background: var(--good);

      .row.fair .fill {
        background: var(--fair);

      .row.low .fill {
        background: var(--low);

        font-weight: 700;

        color: var(--good);

        color: var(--fair);

        color: var(--low);

        font-size: 22px;
        font-weight: 800;
      }

        color: var(--m-muted);
        font-size: 14px;
      }
      .f-pieces {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.1rem;
        align-items: start;
      }
      @media (max-width: 860px) {
        .f-pieces {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      .f-encourage {
        align-items: stretch;
      }
      .encourage {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 10px 12px;
        font-size: 14px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--m-accent) 8%, transparent);
        border: 1px solid color-mix(in srgb, var(--m-accent) 20%, transparent);
      }
      .goal {
        font-weight: 700;
        font-size: 16px;
      }
      .how {
        color: var(--m-muted);
      }
      .practise {

        align-items: center;

        outline-offset: 3px;
      }
      .f-key {
        height: 36px;
        padding: 0 16px;
        font: 700 14px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--m-accent);
        background: var(--m-accent-soft);
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }

      @media (prefers-reduced-motion: reduce) {
        .trophy,
        [data-in] .who,
        [data-in] .block,
        [data-in] .rest li,
        [data-in] .row,
        .play.loading {
          animation: none;
        }
        .reveal,
        .fill {
          transition: none;
        }
        .notes {
          display: none;
        }
      }
