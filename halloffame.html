        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: var(--m-accent);
        color: #fff;
        cursor: pointer;
        transition: transform 0.12s;
      }

        transform: scale(1.08);
      }
      .c-play .c-icon {

        height: 22px;
      }

        animation: c-pulse 0.9s ease-in-out infinite;
      }

          opacity: 0.45;
        }

        height: 6px;
        border-radius: 3px;

        height: 100%;
        background: var(--m-accent);
      }

        flex: none;
        display: grid;
        place-items: center;
        width: 1.8rem;
        height: 1.8rem;
        border-radius: 50%;
        font-weight: 800;
        font-size: 0.85rem;
        background: var(--m-surface);
        color: var(--m-muted);

        background: linear-gradient(135deg, #ffe680, #e0a800);
        color: #5a3d00;
      }
      .c-rank.rank-2 {
        background: linear-gradient(135deg, #f1f3f5, #aab2bb);
        color: #33393f;
      }
      .c-rank.rank-3 {
        background: linear-gradient(135deg, #f5c79a, #b8733a);
        color: #4a2a0c;
      }
      .c-points {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .c-points small {
        font-weight: 600;
        color: var(--m-muted);
      }
      .c-stars {
        color: #e0a800;
        letter-spacing: 0.05em;
      }
      .c-stars .off {
        color: var(--m-line);
