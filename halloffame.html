,"Glissando","Glissandi")}: ein Stilbruch für ${e}`},silent:[["Hast du gespielt?","Wir haben keinen einzigen Ton gehört."],["Hallo? Jemand da?","Kein Ton ist bei uns angekommen."],["Stille Nacht?","Das war sehr leise. Zu leise."],["Hast du gespielt?","Ling Ling hat nichts gehört, und Ling Ling hört alles."]],silentTip:"Prüfe, ob das Mikrofon erlaubt ist und sich die Anzeige bei „Eingang“ beim Spielen bewegt.",praise:[[["Brillant!","Das war reif für die Bühne."],["Bravo!","Das Publikum steht auf."],["Herausragend!","Kaum ein Ton daneben."],["Großartig!","Du hast das Stück zum Singen gebracht."]],[["Glückwunsch!","Ein schöner Vortrag."],["Wunderschön!","Es war eine Freude zuzuhören."],["Wunderbar!","Du kennst dieses Stück richtig gut."],["Schön gespielt!","Nur noch ein paar Feinheiten bis perfekt."]],[["Gut gespielt!","Schön gemacht. Ein bisschen Feinschliff, und es glänzt."],["Gute Arbeit!","Das Stück nimmt Gestalt an."],["Prima!","Du bist auf einem guten Weg."],["Solide Aufnahme!","Bleib dran, dann funkelt es."]],[["Gut versucht!","Da geht noch mehr. Probier es noch einmal!"],["Es wird!","Mit jedem Durchgang wird es runder."],["Nicht schlecht!","Noch ein paar Runden, und du hast es."],["Weiter so!","Das Schwerste hast du hinter dir."]],[["Bleib dran!","Jede Aufnahme macht dich besser."],["Guter Anfang!","Nimm das Tempo raus und versuch es noch einmal."],["Nicht aufgeben!","Auch die Großen haben das geübt."],["Übung macht den Meister!","Markier einen schwierigen Takt und wiederhole ihn."]]],highlights:{intonation:["Deine Intonation war der Star dieser Aufnahme.","Wunderbar sauber!","Dein Gehör hat großartige Arbeit geleistet."],timing:["Genau im Takt, von Anfang bis Ende.","Dein Timing war bombenfest.","Du und das Klavier wart perfekt zusammen."],sound:["Was für ein schönes Vibrato!","Deine langen Töne haben richtig gesungen.","Ein warmer, singender Ton."],dynamics:["Deine Dynamik hat die Musik lebendig gemacht.","Schön gestaltet, laut und leise.","Du bist jedem Cres         width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--m-bg);
        box-shadow:
          0 0 0 3px var(--m-surface),
          0 2px 10px var(--m-shadow);
      }
      .c-avatar.large {
        width: 104px;
        height: 104px;
      }
      .c-avatar.initial {
        background: var(--m-accent);
        color: #fff;
        font-weight: 800;
        font-size: 1.5rem;
      }
      .c-avatar.large.initial {
        font-size: 2.6rem;
      }

      /* The list */
      .c-toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .c-toolbar > div {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      /* The packs: three to a row as the feature cards, across the page's whole width; fewer on narrower pages */
      .c-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
      }
      @media (max-width: 900px) {
        .c-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 600px) {
        .c-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .c-pack {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.1rem;
        transition: box-shadow 0.15s;
      }
      .c-pack:hover {
        box-shadow: 0 4px 18px var(--m-shadow);
      }
      .c-pack.skeleton {
        min-height: 150px;
        background: linear-gradient(90deg, var(--m-surface), var(--m-bg), var(--m-surface));
        background-size: 200% 100%;
        animation: c-shimmer 1.4s linear infinite;
      }
      @keyframes c-shimmer {
        to {
          background-position: -200% 0;
        }
      }
      .c-pack-open {
        display: flex;
        gap: 0.9rem;
        padding: 0;
        border: none;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .c-pack-icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-pack-icon .c-icon {
        width: 26px;
        height: 26px;
      }
      .c-pack-text {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
      }
      .c-pack-title {
        font-weight: 750;
        font-size: 1.1rem;
        overflow-wrap: anywhere;
      }
      .c-pack-description {
        color: var(--m-muted);
        font-size: 0.92rem;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .c-pack-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.6rem;
        color: var(--m-muted);
        font-size: 0.82rem;
        margin-top: 0.15rem;
      }
      .c-chip {
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        background: var(--m-bg);
        color: var(--m-text);
        font-weight: 600;
      }
      .c-pack .c-actions {
        margin-top: auto;
      }
      .c-confirm {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.85rem;
        border-radius: 12px;
        background: color-mix(in srgb, var(--m-red) 8%, var(--m-surface));
        border: 1px solid color-mix(in srgb, var(--m-red) 30%, var(--m-surface));
        font-size: 0.92rem;
        animation: c-in 0.2s ease-out;
      }
      .c-confirm.inline {
        margin-top: 0.75rem;
      }
      @keyframes c-in {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      .c-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.75rem;
        padding: 3rem 1.5rem;
      }
      .c-empty p {
        color: var(--m-muted);
        max-width: 28em;
      }
      .c-empty-icon {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-empty-icon .c-icon {
        width: 38px;
        height: 38px;
      }

      /* Narrower: one column */
      @media (max-width: 760px) {
        .c-hero {
          grid-template-columns: minmax(0, 1fr);
        }
        .c-hero-art {
          order: -1;
        }
        .c-hero-art svg {
          max-width: 220px;
        }
        .c-features,
        .c-steps ol {
          grid-template-columns: minmax(0, 1fr);
        }
        .c-steps li {
          flex-direction: row;
          align-items: center;
        }
        .c-cta {
          flex-direction: column;
          align-items: flex-start;
        }
      }
      @media (max-width: 480px) {
        .c-main {
          padding: 1.25rem 0.75rem 7rem;
        }
        .c-card {
          padding: 1rem;
        }
        .m-header {
          padding: 0.55rem 0.75rem;
        }
        .m-name {
          font-size: 1rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .front,
        .c-pack.skeleton,
        .skeleton {
          animation: none;
        }
      }

      }

        align-items: center;
        gap: 0.65rem;

        border-radius: 10px;
        background: var(--m-bg);
      }
      .c-row.me {
        box-shadow: inset 0 0 0 2px var(--m-accent-edge);
      }

        background: var(--m-accent-soft);
      }
      .c-row-text {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
      }
      .c-row-name {
        font-weight: 650;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .c-row-detail {
        font-size: 0.78rem;
        color: var(--m-muted);
      }
      /* An interpretation's notes from its creator, under its performers */
      .c-row-notes {
        line-height: 1.4;
        white-space: pre-line;
      }
      .c-row-wide {
        flex-basis: 100%;
        margin: 0;
      }
      .c-row-link,
      .c-icon-link {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        color: var(--m-accent);
        font-size: 0.85rem;
        font-weight: 650;
        text-decoration: none;
      }
      .c-icon-link .c-icon {
        width: 18px;
        height: 18px;
      }
      .c-video {
        position: relative;
        flex: none;
        width: 96px;
        aspect-ratio: 16 / 9;
        border-radius: 7px;
        overflow: hidden;
        background: #000;
      }
      .c-video img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .c-video-play {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff;
        background: rgb(0 0 0 / 0.25);
      }
      .c-play {
        flex: none;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: var(--m-accent);
        color: #fff;
        cursor: pointer;
        transition: transform 0.12s;
      }
      .c-play:hover {
        transform: scale(1.08);
      }
      .c-play .c-icon {
        width: 22px;
        height: 22px;
      }
      .c-play.loading {
        animation: c-pulse 0.9s ease-in-out infinite;
      }
      @keyframes c-pulse {
        50% {
          opacity: 0.45;
        }
      }
      .c-play-progress {
        display: block;
        height: 6px;
        border-radius: 3px;
        background: var(--m-line);
        overflow: hidden;
      }
      /* A progress bar to jump with (take-audio.ts's seekBar()): pressed anywhere in a taller band
         round it (a transparent border), so it is easy to hit */
      .seek {
        box-sizing: content-box;
        border-block: 7px solid transparent;
        background-clip: padding-box;
        cursor: pointer;
        touch-action: manipulation;
      }
      .seek:focus-visible {
        outline: 2px solid var(--m-accent);
        outline-offset: 0;
      }
      .c-play-progress span {
        display: block;
        height: 100%;
        background: var(--m-accent);
      }
      .c-rank {
        flex: none;
        display: grid;
        place-items: center;
        width: 1.8rem;
        height: 1.8rem;
        border-radius: 50%;
        font-weight: 800;
        font-size: 0.85rem;
        background: var(--m-surface);
        color: var(--m-muted);
      }
      .c-rank.rank-1 {
        background: linear-gradient(135deg, #ffe680, #e0a800);
        color: #5a3d00;
      }
      .c-rank.rank-2 {
        background: linear-gradient(135deg, #f1f3f5, #aab2bb);
        color: #33393f;
      }
      .c-rank.rank-3 {
        background: linear-gradient(135deg, #f5c79a, #b8733a);
        color: #4a2a0c;
      }
      .c-points {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .c-points small {
        font-weight: 600;
        color: var(--m-muted);
      }
      .c-stars {
        color: #e0a800;
        letter-spacing: 0.05em;
      }
      .c-stars .off {
        color: var(--m-line);
      }
