po raus und versuch es noch einmal."],["Nicht aufgeben!","Auch die Großen haben das geübt."],["Übung macht den Meister!","Markier einen schwierigen Takt und wiederhole ihn."]]],highlights:{intonation:["Deine Intonation war der Star dieser Aufnahme.","Wunderbar sauber!","Dein Gehör hat großartige Arbeit geleistet."],timing:["Genau im Takt, von Anfang bis Ende.","Dein Timing war bombenfest.","Du und das Klavier wart perfekt zusammen."],sound:["Was für ein schönes Vibrato!","Deine langen Töne haben richtig gesungen.","Ein warmer, singender Ton."],dynamics:["Deine Dynamik hat die Musik lebendig gemacht.","Schön gestaltet, laut und leise.","Du bist jedem Crescendo und Diminuendo gefolgt."],trills:["Funkelnde Triller, schnell und gleichmäßig!","Deine Triller waren eine Freude: schnell und sauber.","Wie ein Singvogel: schöne Triller."],missed:["Kein einziger Ton ausgelassen.","Jeder Ton war da.","Du hast nie den Faden verloren."],wrong:["Blitzsauber: kein falscher Ton.","Jeder Ton war der richtige.","Wunderbar treffsichere Finger."],glide:["Schöne, ausdrucksvolle Glissandi: ganz romantisch!","Deine Glissandi gaben ihm echte romantische Wärme.","Schönes Portamento, genau richtig für diese Musik."]},tips:{intonation:["Tipp: Stimm die langen Töne gegen das Klavier ab.","Tipp: Spiel die schwierigen Takte langsam und hör auf jeden Ton.","Tipp: Prüf deine Intonation an den leeren Saiten."],timing:["Tipp: Schalte den Klick ein und setz mit dem Schlag ein.","Tipp: Zähl die Pausen laut mit, bevor du einsetzt.","Tipp: Nimm das Tempo zurück und steigere es dann wieder."],sound:["Tipp: Probier ein wenig Vibrato auf den langen Tönen.","Tipp: Führ den Bogen gleichmäßig durch die langen Töne.","Tipp: Lass die langen Töne klingen und singen."],dynamics:["Tipp: Achte auf die p und f und mach den Unterschied größer.","Tipp: Gestalte die Gabeln: mit dem Bogen wachsen und abklingen.","Tipp: Spiel die leisen Stellen wirklich leise, dann lass die lauten heraus."],trills:["Tipp: Üb die Triller l         justify-content: flex-start;
      }

      /* Signed out */
      .c-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
        align-items: center;
        gap: 1.5rem;
        padding: clamp(1.5rem, 4vw, 2.75rem);
        border-radius: 20px;
        background:
          radial-gradient(120% 120% at 100% 0%, var(--m-accent-soft), transparent 60%),
          var(--m-surface);
        box-shadow: 0 1px 2px var(--m-shadow);
      }
      .c-hero-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .c-hero h1 {
        font-size: clamp(1.9rem, 5vw, 2.8rem);
      }
      .c-kicker {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--m-accent);
      }
      .c-hero-art svg {
        width: 100%;
        max-width: 340px;
        display: block;
        margin: 0 auto;
        overflow: visible;
      }
      .c-art-page {
        fill: var(--m-surface);
        stroke: var(--m-line);
        stroke-width: 1.5;
      }
      .back .c-art-page {
        fill: var(--m-bg);
      }
      .front .c-art-page {
        filter: drop-shadow(0 6px 14px var(--m-shadow));
      }
      .c-art-line {
        stroke: var(--m-muted);
        stroke-width: 0.8;
        opacity: 0.45;
      }
      .c-art-note {
        fill: var(--m-accent);
      }
      .c-art-badge circle {
        fill: var(--m-accent);
        filter: drop-shadow(0 4px 10px var(--m-shadow));
      }
      .c-art-badge g {
        color: #fff;
      }
      .front {
        animation: c-float 5s ease-in-out infinite;
      }
      @keyframes c-float {
        50% {
          transform: translate(34px, 18px) rotate(-3deg);
        }
      }
      .c-features {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
      }
      .c-feature {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .c-feature p {
        color: var(--m-muted);
        font-size: 0.95rem;
      }
      .c-feature-icon {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
        margin-bottom: 0.25rem;
      }
      .c-feature-icon .c-icon {
        width: 24px;
        height: 24px;
      }
      .c-steps {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .c-steps ol {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
      }
      .c-steps li {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        font-size: 0.95rem;
        line-height: 1.4;
      }
      .c-step-number {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--m-accent);
        color: #fff;
        font-weight: 800;
        font-size: 0.9rem;
      }
      .c-cta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.25rem;
        border: 1px solid var(--m-accent-edge);
        background: var(--m-accent-soft);
      }
      .c-cta div {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .c-cta p {
        color: var(--m-muted);
      }

      .c-badge {
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        background: var(--m-accent);
        color: #fff;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      /* A creator's profile card (the creator page's own, the marketplace's creator page) */
      .c-profile {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: start;
        gap: 1.25rem;
        padding: 1.5rem;
        background:
          radial-gradient(120% 140% at 0% 0%, var(--m-accent-soft), transparent 55%),
          var(--m-surface);
      }
      .c-profile.skeleton {
        min-height: 140px;
        display: block;
        background: linear-gradient(90deg, var(--m-surface), var(--m-bg), var(--m-surface));
        background-size: 200% 100%;
        animation: c-shimmer 1.4s linear infinite;
      }
      .c-profile-text {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        min-width: 0;
      }
      .c-profile-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.6rem;
      }
      /* A YouTube link as a key (youtubeKey()): YouTube's red play sign, opened in a new tab */
      .c-youtube {
        display: inline-flex;
        align-self: flex-start;
        align-items: center;
        gap: 0.45rem;
        height: 36px;
        padding: 0 0.85rem 0 0.6rem;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--m-text);
        text-decoration: none;
        background: var(--m-surface);
        border: 1px solid var(--m-line);
        border-radius: 999px;
      }
      .c-youtube:hover {
        background: var(--m-bg);
      }
      .c-youtube:focus-visible {
        outline: 2px solid var(--m-accent);
        outline-offset: 2px;
      }
      .c-youtube svg {
        flex: none;
        width: 22px;
        height: 22px;
      }
      .c-youtube rect {
        fill: #e62117;
      }
      .c-youtube path {

      .c-about > :last-child {

      }
      .c-about p {
        margin: 0 0 0.6em;
      }
      .c-about h3 {
        margin: 0.9em 0 0.35em;
        font-size: 1.05rem;
      }
      .c-about ul,
      .c-about ol {
        margin: 0 0 0.6em;
        padding-left: 1.4em;
      }
      .c-about a {
        color: var(--m-accent);

      @media (max-width: 760px) {
        .c-profile {
          grid-template-columns: auto minmax(0, 1fr);
        }
      }
      .c-avatar {

        width: 56px;
        height: 56px;
        border-radius: 50%;

        background: var(--m-bg);

          0 2px 10px var(--m-shadow);
      }
      .c-avatar.large {
        width: 104px;
        height: 104px;
      }
      .c-avatar.initial {
        background: var(--m-accent);
        color: #fff;

        font-size: 1.5rem;
      }
      .c-avatar.large.initial {
        font-size: 2.6rem;

      }
      .c-toolbar > div {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
      }

        .c-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 600px) {
        .c-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .c-pack {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.1rem;
        transition: box-shadow 0.15s;
      }
      .c-pack:hover {
        box-shadow: 0 4px 18px var(--m-shadow);
      }
      .c-pack.skeleton {
        min-height: 150px;
        background: linear-gradient(90deg, var(--m-surface), var(--m-bg), var(--m-surface));
        background-size: 200% 100%;
        animation: c-shimmer 1.4s linear infinite;
      }
      @keyframes c-shimmer {
        to {
          background-position: -200% 0;
        }
      }
      .c-pack-open {
        display: flex;
        gap: 0.9rem;
        padding: 0;
        border: none;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .c-pack-icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-pack-icon .c-icon {
        width: 26px;
        height: 26px;
      }
      .c-pack-text {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
      }
      .c-pack-title {
        font-weight: 750;
        font-size: 1.1rem;
        overflow-wrap: anywhere;
      }
      .c-pack-description {
        color: var(--m-muted);
        font-size: 0.92rem;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .c-pack-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.6rem;
        color: var(--m-muted);
        font-size: 0.82rem;
        margin-top: 0.15rem;
      }
      .c-chip {
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        background: var(--m-bg);
        color: var(--m-text);
        font-weight: 600;
      }
      .c-pack .c-actions {
        margin-top: auto;
      }
      .c-confirm {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.85rem;
        border-radius: 12px;

        animation: c-in 0.2s ease-out;

      .c-confirm.inline {

      @keyframes c-in {
        from {

          transform: translateY(-4px);
        }
      }
      .c-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.75rem;
        padding: 3rem 1.5rem;
      }
      .c-empty p {
        color: var(--m-muted);
        max-width: 28em;

      .c-empty-icon {

        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-empty-icon .c-icon {
        width: 38px;
        height: 38px;
      }

      @media (max-width: 760px) {
        .c-hero {
          grid-template-columns: minmax(0, 1fr);
        }
        .c-hero-art {
          order: -1;
        }
        .c-hero-art svg {

        }

        .c-steps ol {
          grid-template-columns: minmax(0, 1fr);
        }
        .c-steps li {
          flex-direction: row;
          align-items: center;
        }
        .c-cta {
          flex-direction: column;
          align-items: flex-start;
        }

        .c-main {
          padding: 1.25rem 0.75rem 7rem;

        .c-card {
          padding: 1rem;
        }
        .m-header {
          padding: 0.55rem 0.75rem;
        }

          font-size: 1rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .front,
        .c-pack.skeleton,
        .skeleton {
          animation: none;
        }
      }
