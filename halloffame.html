        flex-direction: column;
        gap: 0.6rem;
        min-width: 0;
      }
      .c-profile-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.6rem;
      }
      /* The about text, shown and edited alike */
      .c-about {
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .c-about > :first-child {
        margin-top: 0;
      }
      .c-about > :last-child {
        margin-bottom: 0;
      }
      .c-about p {
        margin: 0 0 0.6em;
      }
      .c-about h3 {
        margin: 0.9em 0 0.35em;
        font-size: 1.05rem;
      }
      .c-about ul,
      .c-about ol {
        margin: 0 0 0.6em;
        padding-left: 1.4em;
      }
      .c-about a {
        color: var(--m-accent);
      }
      @media (max-width: 760px) {
        .c-profile {
          grid-template-columns: auto minmax(0, 1fr);
        }
      }
      .c-avatar {
        display: grid;
        place-items: center;
        flex: none;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--m-bg);
        box-shadow:
          0 0 0 3px var(--m-surface),
          0 2px 10px var(--m-shadow);
      }
      .c-avatar.large {
        width: 104px;
        height: 104px;
      }
      .c-avatar.initial {
        background: var(--m-accent);
        color: #fff;
        font-weight: 800;
        font-size: 1.5rem;
      }
      .c-avatar.large.initial {
        font-size: 2.6rem;
      }

      /* The list */
      .c-toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .c-toolbar > div {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      /* The packs: three to a row as the feature cards, across the page's whole width; fewer on narrower pages */
      .c-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
      }
      @media (max-width: 900px) {
        .c-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 600px) {
        .c-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .c-pack {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.1rem;
        transition: box-shadow 0.15s;
      }
      .c-pack:hover {
        box-shadow: 0 4px 18px var(--m-shadow);
      }
      .c-pack.skeleton {
        min-height: 150px;
        background: linear-gradient(90deg, var(--m-surface), var(--m-bg), var(--m-surface));
        background-size: 200% 100%;
        animation: c-shimmer 1.4s linear infinite;
      }
      @keyframes c-shimmer {
        to {
          background-position: -200% 0;
        }
      }
      .c-pack-open {
        display: flex;
        gap: 0.9rem;
        padding: 0;
        border: none;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .c-pack-icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-pack-icon .c-icon {
        width: 26px;
        height: 26px;
      }
      .c-pack-text {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
      }
      .c-pack-title {
        font-weight: 750;
        font-size: 1.1rem;
        overflow-wrap: anywhere;
      }
      .c-pack-description {
        color: var(--m-muted);
        font-size: 0.92rem;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .c-pack-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.6rem;
        color: var(--m-muted);
        font-size: 0.82rem;
        margin-top: 0.15rem;
      }
      .c-chip {
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        background: var(--m-bg);
        color: var(--m-text);
        font-weight: 600;
      }
      .c-pack .c-actions {
        margin-top: auto;
      }
      .c-confirm {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.85rem;
        border-radius: 12px;
        background: color-mix(in srgb, var(--m-red) 8%, var(--m-surface));
        border: 1px solid color-mix(in srgb, var(--m-red) 30%, var(--m-surface));
        font-size: 0.92rem;
        animation: c-in 0.2s ease-out;
      }
      .c-confirm.inline {
        margin-top: 0.75rem;
      }
      @keyframes c-in {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      .c-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.75rem;
        padding: 3rem 1.5rem;
      }
      .c-empty p {
        color: var(--m-muted);
        max-width: 28em;
      }
      .c-empty-icon {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-empty-icon .c-icon {
        width: 38px;
        height: 38px;
      }

      /* Narrower: one column */
      @media (max-width: 760px) {
        .c-hero {
          grid-template-columns: minmax(0, 1fr);
        }
        .c-hero-art {
          order: -1;
        }
        .c-hero-art svg {
          max-width: 220px;
        }
        .c-features,
        .c-steps ol {
          grid-template-columns: minmax(0, 1fr);
        }
        .c-steps li {
          flex-direction: row;
          align-items: center;
        }
        .c-cta {
          flex-direction: column;
          align-items: flex-start;
        }
      }
      @media (max-width: 480px) {
        .c-main {
          padding: 1.25rem 0.75rem 7rem;
        }
        .c-card {
          padding: 1rem;
        }
        .m-header {
          padding: 0.55rem 0.75rem;
        }
        .m-name {
          font-size: 1rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .front,
        .c-pack.skeleton,
        .skeleton {
          animation: none;
        }
      }

        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .c-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.65rem;
        padding: 0.45rem 0.6rem;
        border-radius: 10px;
        background: var(--m-bg);
      }
      .c-row.me {
        box-shadow: inset 0 0 0 2px var(--m-accent-edge);
      }
      .c-row.playing {
        background: var(--m-accent-soft);
      }
      .c-row-text {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
      }
      .c-row-name {
        font-weight: 650;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .c-row-detail {
        font-size: 0.78rem;
        color: var(--m-muted);
      }
      /* An interpretation's notes from its creator, under its performers */
      .c-row-notes {
        line-height: 1.4;
        white-space: pre-line;
      }
      .c-row-wide {
        flex-basis: 100%;
        margin: 0;
      }
      .c-row-link,
      .c-icon-link {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        color: var(--m-accent);
        font-size: 0.85rem;
        font-weight: 650;
        text-decoration: none;
      }
      .c-icon-link .c-icon {
        width: 18px;
        height: 18px;
      }
      .c-video {
        position: relative;
        flex: none;
        width: 96px;
        aspect-ratio: 16 / 9;
        border-radius: 7px;
        overflow: hidden;
        background: #000;
      }
      .c-video img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .c-video-play {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff;
        background: rgb(0 0 0 / 0.25);
      }
      .c-play {
        flex: none;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: var(--m-accent);
        color: #fff;
        cursor: pointer;
        transition: transform 0.12s;
      }
      .c-play:hover {
        transform: scale(1.08);
      }
      .c-play .c-icon {
        width: 22px;
        height: 22px;
      }
      .c-play.loading {
        animation: c-pulse 0.9s ease-in-out infinite;
      }
      @keyframes c-pulse {
        50% {
          opacity: 0.45;
        }
      }
      .c-play-progress {
        display: block;
        height: 6px;
        border-radius: 3px;
        background: var(--m-line);
        overflow: hidden;
      }
      /* A progress bar to jump with (take-audio.ts's seekBar()): pressed anywhere in a taller band
         round it (a transparent border), so it is easy to hit */
      .seek {
        box-sizing: content-box;
        border-block: 7px solid transparent;
        background-clip: padding-box;
        cursor: pointer;
        touch-action: manipulation;
      }
      .seek:focus-visible {
        outline: 2px solid var(--m-accent);
        outline-offset: 0;
      }
      .c-play-progress span {
        display: block;
        height: 100%;
        background: var(--m-accent);
      }
      .c-rank {
        flex: none;
        display: grid;
        place-items: center;
        width: 1.8rem;
        height: 1.8rem;
        border-radius: 50%;
        font-weight: 800;
        font-size: 0.85rem;
        background: var(--m-surface);
        color: var(--m-muted);
      }
      .c-rank.rank-1 {
        background: linear-gradient(135deg, #ffe680, #e0a800);
        color: #5a3d00;
      }
      .c-rank.rank-2 {
        background: linear-gradient(135deg, #f1f3f5, #aab2bb);
        color: #33393f;
      }
      .c-rank.rank-3 {
        background: linear-gradient(135deg, #f5c79a, #b8733a);
        color: #4a2a0c;
      }
      .c-points {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .c-points small {
        font-weight: 600;
        color: var(--m-muted);
      }
      .c-stars {
        color: #e0a800;
        letter-spacing: 0.05em;
      }
      .c-stars .off {
        color: var(--m-line);
      }

        color: var(--m-muted);
      }
      .live .pulse {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        animation: live-pulse 2s ease-out infinite;
      }
      @keyframes live-pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
        }
        70%,
        100% {
          box-shadow: 0 0 0 7px rgba(34, 197, 94, 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .live .pulse {
          animation: none;
        }
      }
      .tag {
        align-self: flex-start;
        padding: 1px 8px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--m-accent);
        border-radius: 999px;
        background: var(--m-accent-soft);
      }

      /* The trophy, bobbing as on the board */
      .trophy {
        flex: none;
        width: 52px;
        height: 42px;
        filter: drop-shadow(0 3px 6px rgba(245, 179, 1, 0.35));
        animation: shine 2.6s ease-in-out infinite;
      }
      .trophy.large {
        width: 80px;
        height: 65px;
      }
      .trophy .cup,
      .trophy .stem {
        fill: #f5b301;
      }
      .trophy .base {
        fill: #d99a00;
      }
      .trophy .handle {
        fill: none;
        stroke: #f5b301;
        stroke-width: 3;
        stroke-linecap: round;
      }
      .trophy .note {
        fill: #fff8e1;
      }
      .trophy .shine {
        fill: none;
        stroke: rgba(255, 255, 255, 0.7);
        stroke-width: 2;
        stroke-linecap: round;
      }
      @keyframes shine {
        50% {
          translate: 0 -3px;
          filter: drop-shadow(0 6px 10px rgba(245, 179, 1, 0.55));
        }
      }

      /* The heading: notes drifting up behind it, the totals */
      .f-heading {
        padding: 26px 28px 22px;
        gap: 20px;
      }
      .f-heading .title {
        font-size: clamp(28px, 5vw, 38px);
      }
      .notes {
        position: absolute;
        inset: 0;
        pointer-events: none;
        container-type: size;
      }
      .notes span {
        position: absolute;
        bottom: -30px;
        color: color-mix(in srgb, var(--m-accent) 35%, transparent);
        animation: drift 6s linear infinite both;
      }
      @keyframes drift {
        0% {
          opacity: 0;
          translate: 0 0;
        }
        15% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          translate: var(--sway) calc(-100cqh - 40px);
          rotate: 25deg;
        }
      }
      .f-totals {
        position: relative;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .f-total {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 12px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--m-accent) 8%, transparent);
        border: 1px solid color-mix(in srgb, var(--m-accent) 20%, transparent);
      }
      .f-total-value {
        font-size: 24px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .f-total-value .star {
        color: var(--gold);
        margin-right: 2px;
      }
      .f-total-label {
        font-size: 12px;
        color: var(--m-muted);
      }
      @media (max-width: 560px) {
        .f-totals {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      /* The podium: second, first, third; each player above their column (highscore-board.ts) */
      .podium {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: end;
        gap: 8px;
        padding-top: 4px;
      }
      .place {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .who {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        max-width: 100%;
        text-align: center;
      }
      [data-in] .who {
        animation: rise 0.45s ease-out both;
        animation-delay: calc(0.35s + var(--delay));

      .medal {
        flex: none;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        font-size: 15px;
        font-weight: 800;
        color: #fff;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--medal) 55%, #fff), var(--medal) 60%);
        box-shadow:
          0 0 0 3px color-mix(in srgb, var(--medal) 35%, transparent),
          0 2px 6px rgba(0, 0, 0, 0.2);
      }
      .place-1 .medal {
        width: 38px;
        height: 38px;
        font-size: 18px;
      }
      .medal.free {
        opacity: 0.35;
      }
      .medal.small {
        width: 22px;
        height: 22px;
        font-size: 12px;
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--medal) 35%, transparent);
      }
      .medal.plain {
        color: var(--m-accent);

      .who .name {

        text-overflow: ellipsis;

        color: var(--m-muted);
      }
      .stars {
        font-size: 11px;
        letter-spacing: 1px;
        color: var(--gold);
        white-space: nowrap;
      }
      .points {

        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .of {
        font-size: 11px;
        font-weight: 600;
        color: var(--m-muted);
      }
      .who .detail {
        font-size: 12px;
        color: var(--m-muted);

        border-radius: 8px 8px 2px 2px;
        background: linear-gradient(180deg, var(--m-accent-soft), color-mix(in srgb, var(--m-accent-soft) 70%, var(--m-line)));
        transform-origin: bottom;
      }
      [data-in] .block {

        animation-delay: var(--delay);

        font-weight: 800;
        color: color-mix(in srgb, var(--m-accent) 45%, transparent);
      }
      .place.mine .block {

      }
      @keyframes grow {
        from {
          transform: scaleY(0);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          translate: 0 8px;
        }
      }

      .rest {

        flex-direction: column;
        gap: 2px;
        margin: 0;
        padding: 10px 0 0;
        list-style: none;
        border-top: 1px solid var(--m-line);
      }
      .rest li {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr) auto auto 64px 28px;
        align-items: center;
        gap: 8px;
        padding: 3px 6px;
        font-size: 14px;
        border-radius: 6px;
      }
      [data-in] .rest li {
        animation: rise 0.35s ease-out both;
        animation-delay: var(--delay);
      }
      .rest li.mine {
        background: color-mix(in srgb, var(--m-accent) 12%, transparent);
      }
      .rest .rank {
        font-weight: 800;
        color: var(--m-accent);
      }
      .rest .name {
        overflow: hidden;
        font-weight: 600;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .rest .when {
        font-size: 12px;
        color: var(--m-muted);
        white-space: nowrap;
      }
      .rest .points {
        font-size: 14px;
        text-align: right;
      }
      @media (max-width: 480px) {
        .rest .when {
          display: none;
        }
        .rest li {
          grid-template-columns: 24px minmax(0, 1fr) auto 64px 28px;
        }
      }

      /* A take's play key: a small round one in the theme colour */
      .play {
        flex: none;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        padding: 0;
        color: var(--m-accent);
        background: color-mix(in srgb, var(--m-accent) 12%, transparent);
        border: 1px solid color-mix(in srgb, var(--m-accent) 30%, transparent);
        border-radius: 50%;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .play:hover,
      .play.on {
        color: #fff;
        background: var(--m-accent);
      }
      .play:focus-visible {
        outline: 2px solid var(--m-accent);
        outline-offset: 2px;
      }
      .play svg {
        width: 13px;
        height: 13px;
        fill: currentColor;
      }
      .play:not(.on) svg {
        margin-left: 2px;
      }
      .play.loading {
        animation: pulse 0.9s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }
      .who .play {
        margin-top: 4px;
      }
      .progress {
        display: block;
        grid-column: 1 / -1;
        width: 100%;
        height: 5px;
        border-radius: 3px;
        background: var(--m-line);
        overflow: hidden;
      }
      /* Pressed to jump (take-audio.ts's seekBar()), anywhere in a taller band round it */
      .seek {
        box-sizing: content-box;
        border-block: 7px solid transparent;
        background-clip: padding-box;
        cursor: pointer;
        touch-action: manipulation;
      }
      .seek:focus-visible {
        outline: 2px solid var(--m-accent);
        outline-offset: 0;
      }
      .who .progress {
        width: 70px;
        margin-top: 4px;
      }
      .progress span {
        display: block;
        height: 100%;
        background: var(--m-accent);
      }
      .failed {
        grid-column: 1 / -1;
        font-size: 12px;
        color: var(--low);
      }

      /* Karma (karma()): the top referrers and the invitation beside them */
      .f-karma {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        gap: 1.1rem;
        align-items: stretch;
      }
      .f-karma-board,
      .f-karma-board > .f-award {
        display: flex;
        flex-direction: column;
      }
      .f-karma-board > .f-award {
        flex: 1;
      }
      .f-invite {
        justify-content: center;
        gap: 14px;
      }
      @media (max-width: 900px) {
        .f-karma {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      /* The awards: the score card's rows */
      .f-awards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.1rem;
      }
      @media (max-width: 900px) {
        .f-awards {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .award-head {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .award-head h3 {
        font-size: 18px;
        font-weight: 800;
      }
      .icon {
        flex: none;
        width: 30px;
        height: 30px;
        fill: none;
        stroke: var(--m-accent);
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon .fill {
        fill: var(--m-accent);
        stroke: none;
      }
      .rows {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .row {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr) minmax(36px, 64px) minmax(30px, auto);
        align-items: center;
        gap: 10px;
        padding: 2px 4px;
        border-radius: 6px;
      }
      [data-in] .row {
        animation: rise 0.4s ease-out both;
        animation-delay: calc(0.3s + var(--delay));
      }
      .row.mine {
        background: color-mix(in srgb, var(--m-accent) 12%, transparent);
      }
      .label {
        overflow: hidden;
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .bar {
        height: 8px;
        border-radius: 4px;
        background: rgba(92, 99, 107, 0.15);
        overflow: hidden;
      }
      .fill {
        display: block;
        width: 0;
        height: 100%;
        border-radius: 4px;
        background: var(--m-accent);
        transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
        transition-delay: calc(0.3s + var(--delay));
      }
      [data-in] .fill {
        width: var(--w);
      }
      .row.good .fill {
        background: var(--good);
      }
      .row.fair .fill {
        background: var(--fair);
      }
      .row.low .fill {
        background: var(--low);
      }
      .value {
        font-size: 15px;
        font-weight: 700;
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .row.good .value {
        color: var(--good);
      }
      .row.fair .value {
        color: var(--fair);
      }
      .row.low .value {
        color: var(--low);
      }

      /* The pieces: a board each, two to a row */
      .f-section-title {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 0.4rem;
      }
      .f-section-title h2 {
        font-size: 22px;
        font-weight: 800;
      }
      .f-section-title p {
        color: var(--m-muted);
        font-size: 14px;
      }
      .f-pieces {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.1rem;
        align-items: start;
      }
      @media (max-width: 860px) {
        .f-pieces {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      /* The board's encouragement and its key */
      .f-encourage {
        align-items: stretch;
      }
      .encourage {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 10px 12px;
        font-size: 14px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--m-accent) 8%, transparent);
        border: 1px solid color-mix(in srgb, var(--m-accent) 20%, transparent);
      }
      .goal {
        font-weight: 700;
        font-size: 16px;
      }
      .how {
        color: var(--m-muted);
      }
      .practise {
        align-self: center;
        display: inline-flex;
        align-items: center;
        height: 40px;
        padding: 0 22px;
        font: 700 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #fff;
        text-decoration: none;
        background: var(--m-accent);
        border: 0;
        border-radius: 12px;
        box-shadow: 0 4px 12px color-mix(in srgb, var(--m-accent) 35%, transparent);
        cursor: pointer;
      }
      .practise:focus-visible,
      .f-key:focus-visible {
        outline: 2px solid var(--m-accent);
        outline-offset: 3px;
      }
      .f-key {
        height: 36px;
        padding: 0 16px;
        font: 700 14px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--m-accent);
        background: var(--m-accent-soft);
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }

      @media (prefers-reduced-motion: reduce) {
        .trophy,
        [data-in] .who,
        [data-in] .block,
        [data-in] .rest li,
        [data-in] .row,
        .play.loading {
          animation: none;
        }
        .reveal,
        .fill {
          transition: none;
        }
        .notes {
          display: none;
        }
      }
