<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Violin Hero</title>
    <script>
      // GitHub Pages serves this for any address it hasn't got. The marketplace, the hall of fame,
      // the creator's page and the profiles moved to Crescendu, shared by all the hero apps: old
      // links here (/marketplace?pack=…, /halloffame, /creator, /profile/<uid>) go on there, for
      // this app's instrument, their query and hash kept.
      (function () {
        var hub = 'https://www.crescendu.com/';
        // The marketplace and the hall of fame have sites of their own (site.ts's PAGE_SITES)
        var sites = { marketplace: 'https://marketplace.crescendu.com/', halloffame: 'https://halloffame.crescendu.com/' };
        var more = location.search ? '&' + location.search.slice(1) : '';
        var match = /^(.*\/)(creator|marketplace|halloffame|profile)(\/(index\.html)?)?$/.exec(location.pathname);
        if (match && sites[match[2]]) return location.replace(sites[match[2]] + '?instrument=violin' + more + location.hash);
        if (match) return location.replace(hub + match[2] + '?instrument=violin' + more + location.hash);
        var profile = /^(.*\/)profile\/([\w-]+)\/?$/.exec(location.pathname);
        if (profile) location.replace(hub + 'profile?instrument=violin&user=' + profile[2] + more + location.hash);
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #1f2328;
        background: #eef0f2;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e8eaed;
          background: #121417;
        }
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      a {
        color: #1c6ef2;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This page isn’t here</h1>
      <p><a href="/">Open Violin Hero</a></p>
    </main>
  </body>
</html>
