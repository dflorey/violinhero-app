`;It`
      .c-rows {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .c-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.65rem;
        padding: 0.45rem 0.6rem;
        border-radius: 10px;
        background: var(--m-bg);
      }
      .c-row.me {
        box-shadow: inset 0 0 0 2px var(--m-accent-edge);
      }
      .c-row.playing {
        background: var(--m-accent-soft);
      }
      .c-row-text {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
      }
      .c-row-name {
        font-weight: 650;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .c-row-detail {
        font-size: 0.78rem;
        color: var(--m-muted);
      }
      .c-row-wide {
        flex-basis: 100%;
        margin: 0;
      }
      .c-row-link,
      .c-icon-link {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        color: var(--m-accent);
        font-size: 0.85rem;
        font-weight: 650;
        text-decoration: none;
      }
      .c-icon-link .c-icon {
        width: 18px;
        height: 18px;
      }
      .c-video {
        position: relative;
        flex: none;
        width: 96px;
        aspect-ratio: 16 / 9;
        border-radius: 7px;
        overflow: hidden;
        background: #000;
      }
      .c-video img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .c-video-play {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff;
        background: rgb(0 0 0 / 0.25);
      }
      .c-play {
        flex: none;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: var(--m-accent);
        color: #fff;
        cursor: pointer;
        transition: transform 0.12s;
      }
      .c-play:hover {
        transform: scale(1.08);
      }
      .c-play .c-icon {
        width: 22px;
        height: 22px;
      }
      .c-play.loading {
        animation: c-pulse 0.9s ease-in-out infinite;
      }
      @keyframes c-pulse {
        50% {
          opacity: 0.45;
        }
      }
      .c-play-progress {
        display: block;
        height: 4px;
        border-radius: 2px;
        background: var(--m-line);
        overflow: hidden;
      }
      .c-play-progress span {
        display: block;
        height: 100%;
        background: var(--m-accent);
      }
      .c-rank {
        flex: none;
        display: grid;
        place-items: center;
        width: 1.8rem;
        height: 1.8rem;
        border-radius: 50%;
        font-weight: 800;
        font-size: 0.85rem;
        background: var(--m-surface);
        color: var(--m-muted);
      }
      .c-rank.rank-1 {
        background: linear-gradient(135deg, #ffe680, #e0a800);
        color: #5a3d00;
      }
      .c-rank.rank-2 {
        background: linear-gradient(135deg, #f1f3f5, #aab2bb);
        color: #33393f;
      }
      .c-rank.rank-3 {
        background: linear-gradient(135deg, #f5c79a, #b8733a);
        color: #4a2a0c;
      }
      .c-points {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .c-points small {
        font-weight: 600;
        color: var(--m-muted);
      }
      .c-stars {
        color: #e0a800;
        letter-spacing: 0.05em;
      }
      .c-stars .off {
        color: var(--m-line);
      }

        flex-direction: column;
        gap: 1rem;
        min-width: 0;
      }
      .c-rich-box {
        border: 1px solid var(--m-line);
        border-radius: var(--m-radius);
        background: var(--m-surface);
        overflow: hidden;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .c-rich-box:focus-within {
        border-color: var(--m-accent);
        box-shadow: 0 0 0 3px var(--m-accent-soft);
      }
      .c-toolbar-format {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
        padding: 0.35rem;
        border-bottom: 1px solid var(--m-line);
        background: var(--m-bg);
      }
      .c-format {
        display: grid;
        place-items: center;
        min-width: 34px;
        height: 34px;
        padding: 0 0.4rem;
        border: none;
        border-radius: 8px;
        background: none;
        color: var(--m-text);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1rem;
        cursor: pointer;
      }
      .c-format:hover {
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-format .c-icon {
        width: 18px;
        height: 18px;
      }
      .c-format-gap {
        width: 1px;
        height: 20px;
        margin: 0 0.3rem;
        background: var(--m-line);
      }
      .c-rich {
        min-height: 160px;
        max-height: 420px;
        overflow-y: auto;
        padding: 0.75rem 0.9rem;
        outline: none;
      }
      .c-rich.empty::before {
        content: attr(data-placeholder);
        color: var(--m-muted);
        opacity: 0.7;
        pointer-events: none;
      }
      @media (max-width: 760px) {
        .c-profile {
          grid-template-columns: auto minmax(0, 1fr);
        }
        .c-profile-edit {
          grid-column: 1 / -1;
          justify-self: start;
        }
        .c-profile-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      /* Editing */
      .c-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .c-field {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        min-width: 0;
      }
      .c-label {
        font-size: 0.82rem;
        font-weight: 650;
        color: var(--m-muted);
      }
      .c-hint {
        font-weight: 400;
        font-size: 0.8rem;
        color: var(--m-muted);
      }
      .c-input {
        box-sizing: border-box;
        width: 100%;
        min-height: var(--m-control);
        padding: 0.55rem 0.8rem;
        border: 1px solid var(--m-line);
        border-radius: var(--m-radius);
        background: var(--m-surface);
        color: var(--m-text);
        font-weight: 400;
        font-size: 0.98rem;
        line-height: 1.4;
        font-family: inherit;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      textarea.c-input {
        resize: vertical;
      }
      select.c-input {
        cursor: pointer;
      }
      .c-input:focus {
        outline: none;
        border-color: var(--m-accent);
        box-shadow: 0 0 0 3px var(--m-accent-soft);
      }
      .c-input::placeholder {
        color: var(--m-muted);
        opacity: 0.7;
      }
      .c-big {
        font-size: 1.15rem;
        font-weight: 650;
      }
      .c-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 0.5rem;
      }
      .c-count {
        display: inline-grid;
        place-items: center;
        min-width: 1.6em;
        height: 1.6em;
        padding: 0 0.35em;
        margin-left: 0.3em;
        border-radius: 999px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
        font-size: 0.8em;
        vertical-align: middle;
      }
      .c-piece {
        animation: c-in 0.25s ease-out;
      }
      .c-piece-head {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .c-piece-number {
        display: grid;
        place-items: center;
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--m-accent);
        color: #fff;
        font-weight: 800;
      }
      .c-piece-title {
        font-size: 1.1rem;
        font-weight: 700;
      }
      .c-piece-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 1rem;
        margin-top: 1rem;
      }
      .c-wide {
        grid-column: 1 / -1;
      }
      .c-drop {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        padding: 1.25rem;
        border: 2px dashed var(--m-line);
        border-radius: 14px;
        text-align: center;
        font-size: 0.95rem;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .c-drop:hover,
      .c-drop.over {
        border-color: var(--m-accent);
        background: var(--m-accent-soft);
      }
      .c-drop-icon {
        color: var(--m-accent);
      }
      .c-drop-icon .c-icon {
        width: 28px;
        height: 28px;
      }
      .c-file {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--m-line);
        border-radius: 12px;
        background: var(--m-bg);
      }
      .c-file.uploading {
        color: var(--m-accent);
      }
      .c-file-icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-file-text {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 0.15rem;
        min-width: 0;
      }
      .c-file-name {
        font-weight: 650;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .c-file-details {
        font-size: 0.82rem;
        color: var(--m-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .c-progress {
        flex: 1;
        display: block;
        height: 6px;
        border-radius: 3px;
        background: var(--m-line);
        overflow: hidden;
        min-width: 60px;
      }
      .c-progress span {
        display: block;
        height: 100%;
        background: var(--m-accent);
        transition: width 0.2s;
      }
      /* Moved every frame while a piece plays: no easing behind it */
      .c-progress.playing span {
        transition: none;
      }
      .c-listening {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0 0.25rem;
      }
      .c-listen-time {
        font-size: 0.82rem;
        color: var(--m-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .c-warning,
      .c-error {
        font-size: 0.85rem;
        margin-top: 0.15rem;
      }
      .c-warning {
        color: var(--m-amber);
      }
      .c-error {
        color: var(--m-red);
      }
      .c-interpretations {
        list-style: none;
        margin: 0 0 0.5rem;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .c-interpretation {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.2fr) 5.5rem auto;
        align-items: center;
        gap: 0.6rem;
        padding: 0.5rem;
        border: 1px solid var(--m-line);
        border-radius: 12px;
        background: var(--m-bg);
        animation: c-in 0.2s ease-out;
      }
      .c-thumb {
        width: 64px;
        height: 36px;
        border-radius: 6px;
        object-fit: cover;
        background: var(--m-line);
      }
      .c-thumb.audio {
        display: grid;
        place-items: center;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-interpretation-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.2rem;
        min-width: 0;
      }
      .c-tag {
        padding: 0.1rem 0.45rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        background: var(--m-accent-soft);
        color: var(--m-accent);
      }
      .c-tag.youtube {
        background: color-mix(in srgb, #ff0033 12%, var(--m-surface));
        color: #e00030;
      }
      .c-performers,
      .c-year {
        min-height: 38px;
        padding: 0.35rem 0.6rem;
        font-size: 0.9rem;
      }
      .c-youtube-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 7rem;
        gap: 0.75rem;
        padding: 0.85rem;
        margin-bottom: 0.5rem;
        border-radius: 12px;
        background: var(--m-bg);
        border: 1px solid var(--m-line);
        animation: c-in 0.2s ease-out;
      }
      .c-add-piece {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 64px;
        border: 2px dashed var(--m-accent-edge);
        border-radius: 16px;
        background: none;
        color: var(--m-accent);
        font-weight: 650;
        font-size: 1rem;
        line-height: 1;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s;
      }
      .c-add-piece:hover {
        background: var(--m-accent-soft);
      }
      /* The save bar along the foot */
      .c-save-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        padding: 0.75rem 1.25rem calc(0.75rem + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--m-surface) 92%, transparent);
        backdrop-filter: blur(8px);
        border-top: 1px solid var(--m-line);
      }
      .c-save-inner {
        width: min(1000px, 100%);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .c-save-status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--m-muted);
        font-size: 0.92rem;
      }
      .c-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--m-green);
        flex: none;
      }
      .dirty .c-dot {
        background: var(--m-amber);
      }
      .failed .c-dot {
        background: var(--m-red);
      }
      .failed .c-save-status {
        color: var(--m-red);
      }

      /* Narrower: the pieces' fields in one column */
      @media (max-width: 760px) {
        .c-piece-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .c-interpretation {
          grid-template-columns: auto minmax(0, 1fr) auto;
        }
        .c-performers {
          grid-column: 1 / 3;
        }
        .c-year {
          grid-column: 3 / 4;
          width: 6rem;
        }
      }
      @media (max-width: 480px) {
        .c-save-inner {
          flex-direction: column;
          align-items: stretch;
          gap: 0.5rem;
        }
      }
